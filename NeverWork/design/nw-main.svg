<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect x="0" y="0" width="1000" height="640" rx="10" fill="var(--surface)"/>
  <rect x="0" y="0" width="1000" height="36" rx="10" fill="var(--muted)" opacity="0.18"/>
  <circle cx="20" cy="18" r="6" fill="var(--error)"/>
  <circle cx="40" cy="18" r="6" fill="var(--warning)"/>
  <circle cx="60" cy="18" r="6" fill="var(--success)"/>
  <text x="500" y="23" text-anchor="middle" font-size="13" fill="var(--muted)">NeverWork — my-project</text>
  <text x="960" y="23" text-anchor="end" font-size="12" fill="var(--muted)">Agent ●</text>

  <rect x="0" y="36" width="230" height="604" fill="var(--bg, var(--surface))" stroke="var(--border)" stroke-width="1"/>
  <rect x="12" y="52" width="206" height="30" rx="8" fill="var(--accent)" opacity="0.15" stroke="var(--accent)"/>
  <text x="24" y="72" font-size="13" fill="var(--accent)">◐ Agent</text>
  <text x="130" y="72" font-size="13" fill="var(--muted)">Chat</text>

  <text x="18" y="108" font-size="11" fill="var(--muted)">会话</text>
  <rect x="12" y="118" width="206" height="28" rx="6" fill="var(--border)" opacity="0.45"/>
  <text x="22" y="137" font-size="12" fill="var(--fg)">重构 auth 模块</text>
  <text x="22" y="168" font-size="12" fill="var(--muted)">修复登录跳转</text>
  <text x="22" y="196" font-size="12" fill="var(--muted)">补充单测</text>

  <line x1="0" y1="230" x2="230" y2="230" stroke="var(--border)"/>
  <text x="18" y="256" font-size="11" fill="var(--muted)">文件</text>
  <text x="22" y="282" font-size="12" fill="var(--fg)">▾ src</text>
  <text x="38" y="306" font-size="12" fill="var(--muted)">main.rs</text>
  <text x="38" y="330" font-size="12" fill="var(--accent)">agent.rs</text>
  <text x="38" y="354" font-size="12" fill="var(--muted)">ui.rs</text>
  <text x="22" y="378" font-size="12" fill="var(--fg)">▾ crates</text>
  <text x="22" y="402" font-size="12" fill="var(--muted)">Cargo.toml</text>

  <rect x="230" y="36" width="510" height="604" fill="var(--surface)"/>
  <rect x="230" y="36" width="510" height="34" fill="var(--muted)" opacity="0.10"/>
  <rect x="240" y="42" width="120" height="24" rx="6" fill="var(--surface)" stroke="var(--border)"/>
  <text x="252" y="58" font-size="12" fill="var(--fg)">agent.rs ●</text>
  <text x="372" y="58" font-size="12" fill="var(--muted)">ui.rs</text>

  <g font-family="Consolas, monospace" font-size="13">
    <text x="248" y="100" fill="var(--muted)"> 1</text><text x="280" y="100" fill="var(--accent)">use</text><text x="316" y="100" fill="var(--fg)">crate::{agent, ui};</text>
    <text x="248" y="124" fill="var(--muted)"> 2</text>
    <text x="248" y="148" fill="var(--muted)"> 3</text><text x="280" y="148" fill="var(--accent)">pub fn</text><text x="336" y="148" fill="var(--fg)">run() {</text>
    <text x="248" y="172" fill="var(--muted)"> 4</text><text x="280" y="172" fill="var(--c4)">    let</text><text x="316" y="172" fill="var(--fg)">app = Agent::new();</text>
    <text x="248" y="196" fill="var(--muted)"> 5</text><text x="280" y="196" fill="var(--c4)">    app</text><text x="316" y="196" fill="var(--fg)">.start();</text>
    <text x="248" y="220" fill="var(--muted)"> 6</text><text x="280" y="220" fill="var(--fg)">}</text>
  </g>
  <rect x="270" y="140" width="330" height="22" fill="var(--accent)" opacity="0.12"/>

  <rect x="740" y="36" width="260" height="604" fill="var(--bg, var(--surface))" stroke="var(--border)" stroke-width="1"/>
