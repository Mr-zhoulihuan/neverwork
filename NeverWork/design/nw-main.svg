  <text x="780" y="116" font-size="11" fill="var(--muted)">需要我改哪里？</text>

  <rect x="756" y="140" width="200" height="40" rx="8" fill="var(--accent)" opacity="0.15" stroke="var(--accent)"/>
  <text x="766" y="158" font-size="11" fill="var(--fg)">把 start() 改成异步</text>
  <text x="766" y="172" font-size="11" fill="var(--muted)">并加错误处理</text>

  <rect x="756" y="580" width="228" height="44" rx="10" fill="var(--surface)" stroke="var(--border)"/>
  <text x="768" y="607" font-size="12" fill="var(--muted)">输入指令…  @ 文件  / 命令</text>
  <rect x="948" y="588" width="28" height="28" rx="8" fill="var(--accent)"/>
  <text x="962" y="607" text-anchor="middle" font-size="14" fill="var(--surface)">↑</text>
