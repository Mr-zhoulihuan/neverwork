[package]
name = "neverwork"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "neverwork"

[[bin]]
name = "neverwork"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
# 把 assets/neverwork.rc（应用图标 + 版本信息）编进 exe。
embed-resource = "3"

[dependencies]
gpui.workspace = true
neverwork-core = { path = "../core" }
neverwork-ui = { path = "../ui" }
neverwork-agent = { path = "../agent" }
flume = "0.11"
notify = "8"
serde.workspace = true
serde_json = "1"
ureq = { version = "3", features = ["json"] }
tracing.workspace = true
tracing-subscriber.workspace = true
