[package]
name = "neverwork"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "neverwork"

[[bin]]
name = "neverwork"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
# 把 assets/neverwork.rc（应用图标 + 版本信息）编进 exe。
embed-resource = "3"

[dependencies]
gpui.workspace = true
neverwork-core = { path = "../core" }
neverwork-ui = { path = "../ui" }
neverwork-agent = { path = "../agent" }
# data URI 图片（模型把图直接画进正文）解码缓存用。
base64 = "0.22"
flume = "0.11"
# 与 gpui 共用同一版本/特性：用于「未知扩展名文件是不是图片」的内容探测。
image = "0.25"
notify = "8"
serde.workspace = true
serde_json = "1"
ureq = { version = "3", features = ["json"] }
tracing.workspace = true
tracing-subscriber.workspace = true
