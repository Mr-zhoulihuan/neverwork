# 打 tag 触发：全平台编译并生成 GitHub Release。
#
# 发版流程：改 NeverWork/Cargo.toml 的 version（同步 crates/app/assets/neverwork.rc）
# → git tag v<version> → git push github refs/tags/v<version>
# tag 必须与 workspace 版本一致，否则 meta job 直接失败（版本号只认 Cargo.toml）。
# 也能在 Actions 页手动 Run workflow：跳过 tag 校验，按 Cargo.toml 版本编译并发布到 v<version>。
#
# 产物矩阵（<v> = Cargo.toml 版本）：
#   Windows x64    NeverWork-<v>-setup.exe / NeverWork-<v>-windows-x64.zip     ← 阻塞平台
#   Windows arm64  NeverWork-<v>-windows-arm64-setup.exe / NeverWork-<v>-windows-arm64.zip
#   Linux x64      NeverWork-<v>-linux-x86_64.tar.gz
#   Linux arm64    NeverWork-<v>-linux-arm64.tar.gz
#   macOS arm64    NeverWork-<v>-macos-arm64.dmg / NeverWork-<v>-macos-arm64.zip
#   macOS x64      NeverWork-<v>-macos-x64.dmg / NeverWork-<v>-macos-x64.zip
#
# 门禁：Windows x64 是阻塞平台（失败则不发版）；其余平台是实验性构建，
# 失败只让本次运行标红，不影响 Release 生成（release job 用 if: always()，
# 缺的产物按 dist/ 里的文件名检查并写进 Release 正文）。
# Linux arm64 走 GitHub 原生 arm64 runner（ubuntu-24.04-arm，公开仓库免费用）。

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: 校验版本（tag 触发时 tag 必须与 Cargo.toml 一致）
        shell: bash
        run: |
          set -euo pipefail
          # 只取 [workspace.package] 段里的 version，避免依赖行序。
          VERSION=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' NeverWork/Cargo.toml | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "无法从 NeverWork/Cargo.toml 的 [workspace.package] 读取 version" >&2
            exit 1
          fi
          TAG="v$VERSION"
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "$GITHUB_REF_NAME" != "$TAG" ]; then
              echo "tag $GITHUB_REF_NAME 与 Cargo.toml 版本 $TAG 不一致" >&2
              exit 1
            fi
            TAG="$GITHUB_REF_NAME"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "版本校验通过：$VERSION（tag：$TAG）"

  # ---------- Windows ----------

  build-windows:
    needs: meta
    runs-on: windows-latest
    defaults:
      run:
        working-directory: NeverWork
    env:
      APP_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "NeverWork -> target"
      - name: 编译 release（x64）
        run: cargo build --release -p neverwork
      - name: 生成 NSIS 安装包（x64）
        shell: pwsh
        working-directory: NeverWork/installer
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { $makensis = $cmd.Source }
          }
          if (-not $makensis) {
            Write-Host "未找到 NSIS，尝试通过 choco 安装"
            choco install nsis -y --no-progress
            $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $makensis) { throw "未找到 makensis.exe" }
          # nsi 的 OutFile 指向 ..\dist\，makensis 不会自己建目录（本地 build.ps1 里有这步）。
          New-Item -ItemType Directory -Force "..\dist" | Out-Null
          & $makensis "/DAPP_VERSION=$env:APP_VERSION" "neverwork.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis 编译失败" }
          Get-Item "..\dist\NeverWork-$env:APP_VERSION-setup.exe" | Select-Object FullName, Length
      # 产物统一放进 NeverWork/dist/ 再上传：upload-artifact 会按公共父目录保内部路径，
      # 多目录上传会让文件在 Release 里带子目录（dist/NeverWork/...），这里规避掉。
      - name: 打包便携版 zip（x64）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target\release\neverwork.exe `
            -DestinationPath "dist\NeverWork-$env:APP_VERSION-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: NeverWork/dist/
          if-no-files-found: error

  build-windows-arm64:
    needs: meta
    # 交叉编译：windows-latest 自带 MSVC ARM64 工具链；实验性平台，失败不阻塞发版。
    runs-on: windows-latest
    defaults:
      run:
        working-directory: NeverWork
    env:
      APP_VERSION: ${{ needs.meta.outputs.version }}
      TARGET: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "NeverWork -> target"
      - name: 编译 release（arm64）
        run: cargo build --release -p neverwork --target $env:TARGET
      - name: 生成 NSIS 安装包（arm64）
        shell: pwsh
        working-directory: NeverWork/installer
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { $makensis = $cmd.Source }
          }
          if (-not $makensis) {
            Write-Host "未找到 NSIS，尝试通过 choco 安装"
            choco install nsis -y --no-progress
            $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $makensis) { throw "未找到 makensis.exe" }
          New-Item -ItemType Directory -Force "..\dist" | Out-Null
          # nsi 默认取 target\release，这里用 /D 指到 arm64 产物并改输出文件名。
          & $makensis "/DAPP_VERSION=$env:APP_VERSION" `
            "/DAPP_EXE_DIR=..\target\$env:TARGET\release" `
            "/DOUT_NAME=NeverWork-$env:APP_VERSION-windows-arm64-setup.exe" `
            "neverwork.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis 编译失败" }
          Get-Item "..\dist\NeverWork-$env:APP_VERSION-windows-arm64-setup.exe" | Select-Object FullName, Length
      - name: 打包便携版 zip（arm64）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target\$env:TARGET\release\neverwork.exe" `
            -DestinationPath "dist\NeverWork-$env:APP_VERSION-windows-arm64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: NeverWork/dist/
          if-no-files-found: error

  # ---------- Linux ----------

  build-linux:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04-arm 是 GitHub 原生 arm64 runner（公开仓库免费）。
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: NeverWork
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 安装 gpui 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libfontconfig1-dev \
            libfreetype6-dev libvulkan-dev mesa-vulkan-drivers libgl1-mesa-dri
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "NeverWork -> target"
      - name: 编译 release（${{ matrix.arch }}）
        run: cargo build --release -p neverwork
      - name: 打包二进制
        run: |
          mkdir -p dist
          tar -czf "dist/NeverWork-$VERSION-linux-${{ matrix.arch }}.tar.gz" -C target/release neverwork
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: NeverWork/dist/
          if-no-files-found: error

  # ---------- macOS ----------

  build-macos:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest 是 arm64 机器：arm64 原生编译，x64 交叉编译（同一套 SDK）。
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    runs-on: macos-latest
    defaults:
      run:
        working-directory: NeverWork
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
      # 两个架构统一最低系统版本，避免 Rust 默认值（x64 10.12 / arm64 11.0）不一致。
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "NeverWork -> target"
      - name: 编译 release（${{ matrix.arch }}）
        run: cargo build --release -p neverwork --target ${{ matrix.target }}
      - name: 组装 .app 并打包 dmg / zip
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=pkg
          APP="$APP_DIR/NeverWork.app"
          rm -rf "$APP_DIR"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp "target/$TARGET/release/neverwork" "$APP/Contents/MacOS/NeverWork"
          chmod +x "$APP/Contents/MacOS/NeverWork"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleName</key><string>NeverWork</string>
            <key>CFBundleDisplayName</key><string>NeverWork</string>
            <key>CFBundleIdentifier</key><string>com.neverwork.ide</string>
            <key>CFBundleExecutable</key><string>NeverWork</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleIconFile</key><string>neverwork.icns</string>
            <key>LSMinimumSystemVersion</key><string>${MACOSX_DEPLOYMENT_TARGET}</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          # 图标：ico → png → icns，纯尽力而为（失败只是没有图标，不影响包）。
          if sips -s format png crates/app/assets/neverwork.ico --out /tmp/nw-base.png >/dev/null 2>&1; then
            rm -rf /tmp/nw.iconset && mkdir -p /tmp/nw.iconset
            for s in 16 32 128 256 512; do
              sips -z "$s" "$s" /tmp/nw-base.png --out "/tmp/nw.iconset/icon_${s}x${s}.png" >/dev/null 2>&1 || true
              d=$((s * 2))
              sips -z "$d" "$d" /tmp/nw-base.png --out "/tmp/nw.iconset/icon_${s}x${s}@2x.png" >/dev/null 2>&1 || true
            done
            iconutil -c icns /tmp/nw.iconset -o "$APP/Contents/Resources/neverwork.icns" >/dev/null 2>&1 \
              || echo "icns 生成失败，跳过图标"
          else
            echo "ico 转 png 失败，跳过图标"
          fi

          # ad-hoc 签名：arm64 上未签名的二进制会被内核直接拒绝。
          codesign --force --deep --sign - "$APP"

          # dmg 里放一个 /Applications 软链，方便拖拽安装。
          ln -sf /Applications "$APP_DIR/Applications"
          mkdir -p dist
          hdiutil create -volname "NeverWork $VERSION" -srcfolder "$APP_DIR" -ov -format UDZO \
            "dist/NeverWork-$VERSION-macos-$ARCH.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/NeverWork-$VERSION-macos-$ARCH.zip"
          ls -lh "dist/NeverWork-$VERSION-macos-$ARCH.dmg" "dist/NeverWork-$VERSION-macos-$ARCH.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: NeverWork/dist/
          if-no-files-found: error

  # ---------- 发布 ----------

  release:
    needs: [meta, build-windows, build-windows-arm64, build-linux, build-macos]
    if: always() && needs.meta.result == 'success' && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 发布到 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            # --target：手动 run 时 release 指向本次构建的提交，而不是默认分支 HEAD。
            gh release create "$TAG" dist/* \
              --title "NeverWork $VERSION" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi

          # 按文件名检查实验性平台是否缺产物（比看 job 结果更准）。
          MISSING=""
          for f in \
            "NeverWork-$VERSION-setup.exe" \
            "NeverWork-$VERSION-windows-x64.zip" \
            "NeverWork-$VERSION-windows-arm64-setup.exe" \
            "NeverWork-$VERSION-windows-arm64.zip" \
            "NeverWork-$VERSION-linux-x86_64.tar.gz" \
            "NeverWork-$VERSION-linux-arm64.tar.gz" \
            "NeverWork-$VERSION-macos-arm64.dmg" \
            "NeverWork-$VERSION-macos-x64.dmg" \
            ; do
            if [ ! -f "dist/$f" ]; then MISSING="$MISSING $f"; fi
          done

          # 重跑同一个 tag 时先去掉上一轮追加的提示，避免正文里越积越多。
          gh release view "$TAG" --json body -q .body --repo "$GITHUB_REPOSITORY" \
            | python3 -c "import re,sys; s=sys.stdin.read(); s=re.sub(r'(?m)^> (本次未产出|macOS 包).*\n?', '', s); print(s.rstrip())" > body.md
          if [ -n "$MISSING" ]; then
            printf '\n> 本次未产出%s（见 Actions 日志）。\n' "$MISSING" >> body.md
          fi
          if compgen -G "dist/*.dmg" >/dev/null; then
            printf '\n> macOS 包为 ad-hoc 签名、未公证：首次打开请「右键 → 打开」（或 `xattr -dr com.apple.quarantine /Applications/NeverWork.app`）。\n' >> body.md
          fi
          timeout 60s gh release edit "$TAG" --notes-file body.md --repo "$GITHUB_REPOSITORY"
