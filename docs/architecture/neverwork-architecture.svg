  <line x1="830" y1="844" x2="880" y2="844" stroke="#d29922" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr-orange)"/>
  <text x="894" y="848" class="t muted" font-size="11">子进程 / 文件 / 网络</text>

  <text x="830" y="884" class="t muted" font-size="10">canonical 源：system-context.dot · system-containers.dot</text>
  <text x="830" y="902" class="t muted" font-size="10">证据与置信度：system-model.evidence.md</text>
